# Dev profile: H2 file-mode database, zero external services required.
# The database file lives at <backend working dir>/data/eventzonedb.mv.db
# and persists across restarts. AUTO_SERVER=TRUE lets the H2 console (or
# another local tool) connect to the same file concurrently if needed.
spring:
  datasource:
    url: jdbc:h2:file:./data/eventzonedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.eventzone: INFO
